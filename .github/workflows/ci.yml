name: ci

# Runs only for changes that matter: documentation-only pushes / pull requests do not
# start it at all, and the "changes" job below skips every job whose inputs did not
# change. Pull requests (also from forks) are tested; nothing is published for them.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
      - '**.png'
      - '**.jpg'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
      - '**.png'
      - '**.jpg'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the running check; pushes to main and
# tags always finish (they publish).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/spot-lyric-server

jobs:
  # What changed: go (server program), plugin (src / JS tests), scripts (patch.sh / .ps1),
  # docker (image inputs). Manual runs, tags and workflow edits run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      plugin: ${{ steps.diff.outputs.plugin }}
      scripts: ${{ steps.diff.outputs.scripts }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/changes.sh

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.plugin == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.plugin == 'true'
        with: { node-version: 24 }
      - uses: actions/setup-go@v5
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.plugin == 'true'
        with: { go-version: '1.24' }
      - if: needs.changes.outputs.go == 'true'
        run: go vet ./... && go test ./...
      # The live test hits real NetEase / QQ APIs, which throttle datacenter addresses: run it locally.
      # server.test.mjs builds the Go server, so these also run for Go changes.
      - if: needs.changes.outputs.go == 'true' || needs.changes.outputs.plugin == 'true'
        run: node --test tests/core.test.mjs tests/server.test.mjs tests/net.test.mjs
        env: { SPOT_LYRIC_OFFLINE: '1' }
      # patch.sh (pure sh, python / zip / unzip shadowed) and patch.ps1 (pwsh) on a synthetic xpui.spa.
      - if: needs.changes.outputs.scripts == 'true'
        run: bash tests/patch_test.sh

  # The patch scripts on their own systems: macOS with its bash 3.2, Windows PowerShell 5.1.
  patch-macos:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/patch_test.sh
        env: { BASH_BIN: /bin/bash, PWSH: '' }
  patch-windows:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\patch_test.ps1

  # spot-lyric-server (lyrics server / local service of pure local mode) for every system,
  # each built and tested on a native runner of its own system / architecture.
  # patch.sh / patch.ps1 download it only for --mode local (when Go is not installed).
  binaries:
    needs: [changes, test]
    if: ${{ !cancelled() && needs.changes.outputs.go == 'true' && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    asset: spot-lyric-server-linux-amd64 }
          - { runner: ubuntu-24.04-arm, asset: spot-lyric-server-linux-arm64 }
          - { runner: macos-15-intel,   asset: spot-lyric-server-darwin-amd64 }
          - { runner: macos-latest,     asset: spot-lyric-server-darwin-arm64 }
          - { runner: windows-latest,   asset: spot-lyric-server-windows-amd64.exe }
          - { runner: windows-11-arm,   asset: spot-lyric-server-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.asset }} ./cmd/spot-lyric-server
      - run: ./dist/${{ matrix.asset }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Release v<VERSION>: created by the first push of a version, assets refreshed by later pushes.
  # Only for pushes to main / tags with new binaries, never for pull requests.
  release:
    needs: [binaries, patch-macos, patch-windows]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.binaries.result == 'success'
      && needs.patch-macos.result != 'failure' && needs.patch-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: spot-lyric-server-*
          merge-multiple: true
      - run: cd dist && sha256sum spot-lyric-server-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(tr -d ' \r\n' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($tag)"; exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Spot-Lyric $tag" \
              --notes "spot-lyric-server for Windows / macOS / Linux: the local service of pure local mode (installed by patch.sh / patch.cmd with --mode local) and the lyrics server. See README."
          fi
          gh release upload "$tag" dist/* --clobber
          # Drop assets this build no longer ships.
          for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            [ -f "dist/$asset" ] || gh release delete-asset "$tag" "$asset" -y
          done

  # Docker image (pushes to main / tags only): amd64 and arm64 are built separately, each
  # on a native runner. Only server/Dockerfile changed: test is skipped, the image still builds.
  build:
    needs: [changes, test]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.docker == 'true'
      && needs.test.result != 'failure' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine both single-arch images into one multi-arch tag on GitHub Packages (ghcr.io).
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
