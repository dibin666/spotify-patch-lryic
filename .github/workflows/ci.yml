name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/spot-lyric-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: go vet ./... && go test ./...
      # The live test hits real NetEase / QQ APIs, which throttle datacenter addresses: run it locally.
      - run: node --test tests/core.test.mjs tests/server.test.mjs
        env: { SPOT_LYRIC_OFFLINE: '1' }
      # patch.sh (python + zip patchers) and patch.ps1 (pwsh) on a synthetic xpui.spa.
      - run: bash tests/patch_test.sh

  # The patch scripts on their own systems: macOS with its bash 3.2, Windows PowerShell 5.1.
  patch-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/patch_test.sh
        env: { BASH_BIN: /bin/bash, PWSH: '' }
  patch-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\patch_test.ps1

  # spot-lyric-server (lyrics server / local service of pure local mode) for every system,
  # each built and tested on a native runner of its own system / architecture.
  # patch.sh / patch.ps1 download it only for --mode local (when Go is not installed).
  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    asset: spot-lyric-server-linux-amd64 }
          - { runner: ubuntu-24.04-arm, asset: spot-lyric-server-linux-arm64 }
          - { runner: macos-15-intel,   asset: spot-lyric-server-darwin-amd64 }
          - { runner: macos-latest,     asset: spot-lyric-server-darwin-arm64 }
          - { runner: windows-latest,   asset: spot-lyric-server-windows-amd64.exe }
          - { runner: windows-11-arm,   asset: spot-lyric-server-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o dist/${{ matrix.asset }} ./cmd/spot-lyric-server
      - run: ./dist/${{ matrix.asset }} version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Release v<VERSION>: created by the first push of a version, assets refreshed by later pushes.
  release:
    needs: [binaries, patch-macos, patch-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: spot-lyric-server-*
          merge-multiple: true
      - run: cd dist && sha256sum spot-lyric-server-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(tr -d ' \r\n' < VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($tag)"; exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Spot-Lyric $tag" \
              --notes "spot-lyric-server for Windows / macOS / Linux: the local service of pure local mode (installed by patch.sh / patch.cmd with --mode local) and the lyrics server. See README."
          fi
          gh release upload "$tag" dist/* --clobber
          # Drop assets this build no longer ships.
          for asset in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            [ -f "dist/$asset" ] || gh release delete-asset "$tag" "$asset" -y
          done

  # Docker image: amd64 and arm64 are built separately, each on a native runner.
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine both single-arch images into one multi-arch tag on GitHub Packages (ghcr.io).
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
